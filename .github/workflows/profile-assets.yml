name: Build profile assets

on:
  schedule:
    - cron: "17 4,16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Snake-eating-the-contribution-graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#f5f5f7&color_dots=#0e0e11,#2c2c33,#4a4a52,#6c6c75,#94949d

      # snk runs in a container as root, so dist/ comes back not writable by us
      - name: Take ownership of dist
        run: sudo chown -R "$(id -u):$(id -g)" dist && ls -la dist

      - name: Hero card
        run: python3 .github/scripts/gen_header.py dist/header.svg

      - name: Stack card
        run: python3 .github/scripts/gen_skills.py dist/skills.svg

      - name: 42 cursus card
        run: python3 .github/scripts/gen_42_badge.py slasfar dist/42.svg

      - name: GitHub stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_stats.py ${{ github.repository_owner }} dist/stats.svg

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
